<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eagle Golden Chest 🦅💰</title>
    
    <meta property="fc:frame" content='{"version":"next","imageUrl":"https://eagle-golden-chest.vercel.app/close.png","buttonName":"Open the Chest 🦅"}' />

    <script src="https://unpkg.com/ethers@6.7.0/dist/ethers.umd.min.js"></script>
    
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { color: #ffd700; font-size: 1.6rem; margin-bottom: 5px; text-shadow: 0 0 15px rgba(255, 215, 0, 0.4); text-align: center; }
        p { color: #aaa; margin-top: 0; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }
        .chest-container { width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; }
        .chest-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; }
        .chest-img.shake { animation: shake 0.5s infinite; }
        #open-btn { background: linear-gradient(135deg, #ffd700, #ffa500); color: #000; font-weight: bold; font-size: 1rem; padding: 15px 35px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 165, 0, 0.4); }
        #status { margin-top: 20px; font-weight: bold; text-align: center; max-width: 300px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .win { color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
        .lose { color: #ff4d4d; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <h1>EAGLE GOLDEN CHEST 🦅💰</h1>
    <p>Open the safe and try to multiply your ETH instantly!</p>

    <div class="chest-container">
        <img src="close.png" id="chest" class="chest-img" alt="Eagle Chest">
    </div>

    <button id="open-btn">OPEN CHEST (0.0003 ETH)</button>
    <div id="status"></div>

    <script>
        const MY_WALLET = "0x872bD846596Cc1aEde8Fd800997d242e3473fA83";
        
        const openBtn = document.getElementById('open-btn');
        const chestImg = document.getElementById('chest');
        const statusDiv = document.getElementById('status');

        openBtn.onclick = async () => {
            // Vérification de la présence d'Ethers
            if (typeof ethers === 'undefined') {
                statusDiv.innerText = "Error: Loading core components, please try again in a few seconds...";
                return;
            }

            // Vérification du wallet injecté
            if (!window.ethereum) {
                alert("Wallet not detected. Please use an in-app crypto browser.");
                return;
            }

            try {
                statusDiv.className = ""; 
                statusDiv.innerText = "Connecting wallet...";
                
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (!accounts || accounts.length === 0) {
                    statusDiv.innerText = "Wallet connection denied.";
                    return;
                }

                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const playerAddress = accounts[0];

                statusDiv.innerText = "Requesting payment of 0.0003 ETH...";
                
                const tx = await signer.sendTransaction({
                    to: MY_WALLET,
                    value: ethers.parseEther("0.0003")
                });

                statusDiv.innerText = "Confirming payment on Base... ⏳";
                chestImg.classList.add('shake');
                
                const receipt = await tx.wait();

                statusDiv.innerText = "Revealing your reward...";
                
                const response = await fetch('/api/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ txHash: receipt.hash, player: playerAddress })
                });
                const result = await response.json();
                chestImg.classList.remove('shake');

                if (parseFloat(result.winAmount) > 0) {
                    chestImg.src = "open.png"; 
                    statusDiv.className = "win";
                    statusDiv.innerHTML = `🎉 **YOU WIN!** 🎉<br>You won **${result.winAmount} ETH** sent instantly to your wallet!`;
                } else {
                    chestImg.src = "close.png";
                    statusDiv.className = "lose";
                    statusDiv.innerText = "❌ Better luck next time... The chest is empty! Try again!";
                }
            } catch (error) {
                chestImg.classList.remove('shake');
                console.error("Error details:", error);
                statusDiv.innerText = "Error: " + (error.message || "Transaction cancelled.");
            }
        };
    </script>
</body>
</html>
